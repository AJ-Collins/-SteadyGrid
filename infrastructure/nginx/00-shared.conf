# Shared rate-limit zones (edge layer). Rates mirror the app-level named
# limiters in src/server/rate-limit/limiters.ts — nginx sheds the flood
# before Node ever sees it. 10m ≈ 160k IPs per zone.

# Auth screens: tight, identity buckets are enforced in-app.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_general:10m rate=10r/m;

# Session refresh: generous so passive restores never burn login budget.
limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=20r/m;

# Public forms and APIs.
limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

# Edge gateway: subdomains route to one Next.js app (host = surface),
# per-surface rate zones shed floods before Node. Correct client-IP keying
# needs real_ip (proxy_protocol / X-Forwarded-For from the CDN/LB) so one
# shared egress IP doesn't burn a single bucket for everyone.

upstream web {
  server web:3000;
}

# Apex + admin + cms share one server: the Host header picks the surface
# (see src/middleware.ts).
server {
  listen 80;
  server_name steadygrid.com www.steadygrid.com admin.steadygrid.com cms.steadygrid.com;

  # Real client IP for limit_req keying and X-Forwarded-For.
  # set_real_ip_from <cdn/lb ranges>;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;

  # Auth screens: burst for double-submits, then 503.
  location = /auth/login {
    limit_req zone=auth_login burst=3 nodelay;
    proxy_pass http://web;
  }
  location = /auth/register {
    limit_req zone=auth_login burst=3 nodelay;
    proxy_pass http://web;
  }
  location = /auth/forgot-password {
    limit_req zone=auth_login burst=3 nodelay;
    proxy_pass http://web;
  }

  # Session restore / rotation: separate generous budget.
  location = /api/auth/refresh {
    limit_req zone=auth_refresh burst=10 nodelay;
    proxy_pass http://web;
  }
  location = /api/auth/me {
    limit_req zone=auth_refresh burst=10 nodelay;
    proxy_pass http://web;
  }

  # Public contact form.
  location = /api/contact {
    limit_req zone=contact burst=5 nodelay;
    proxy_pass http://web;
  }

  location /api/ {
    limit_req zone=api_general burst=30 nodelay;
    proxy_pass http://web;
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
